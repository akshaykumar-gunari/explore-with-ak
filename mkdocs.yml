site_name: Explore with AK
site_url: https://akshaykumar-gunari.github.io/explore-with-ak/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - header.autohide
    - announce.dismiss

  language: en
  font:
    code: Roboto Mono

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/akshaykumar-gunari
    - icon: fontawesome/brands/twitter
      link: https://x.com/AkshaykumarGun2
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/akshaykumar-gunari-59b132167/

plugins:
  - search
  - git-authors

nav:
  - Home: index.md
  - Linux:
      - linux/index.md
      - Kernel:
          - linux/kernel/index.md
          - Direct Memory Access:
            - linux/kernel/dma/index.md
          - Communication Protocols:
            - linux/kernel/protocols/index.md
            - i2c:
              - linux/kernel/protocols/i2c/index.md
            - i3c:
              - linux/kernel/protocols/i3c/index.md
            - spi:
              - linux/kernel/protocols/spi/index.md

  - AI & ML:
      - ai-ml/index.md
  - Mathematics:
      - mathematics/index.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

copyright: |
  &copy; 2026 <a href="https://github.com/akshaykumar-gunari" target="_blank" rel="noopener">Akshaykumar Gunari | AK</a>